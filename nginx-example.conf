# Example only: use inside your server's Nginx config (not in public_html).
# Replace certificate paths with your actual certificates (e.g. Certbot).
server {
    listen 80;
    server_name aulad.me www.aulad.me;
    return 301 https://aulad.me$request_uri;
}
server {
    listen 443 ssl;
    server_name www.aulad.me;
    ssl_certificate /etc/letsencrypt/live/aulad.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aulad.me/privkey.pem;
    return 301 https://aulad.me$request_uri;
}
server {
    listen 443 ssl;
    server_name aulad.me;
    root /var/www/aulad.me;
    index index.html;
    ssl_certificate /etc/letsencrypt/live/aulad.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aulad.me/privkey.pem;
    location / { try_files $uri $uri/ =404; }
}
